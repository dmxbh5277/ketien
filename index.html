<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảng Kê Tiền - Compact Mobile Dashboard</title>
    <!-- Nhập font Google Sans từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Thư viện chụp màn hình -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border-light: #f1f5f9;
            --border-table: #e2e8f0;
            --primary: #6366f1;
            --pastel-blue-bg: #f8fafc;
            --success: #059669;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 4px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 8px 10px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-light);
        }

        h2 {
            text-align: center;
            color: #0f172a;
            margin: 0 0 6px 0;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.3px;
        }

        .dashboard-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .input-card {
            background: var(--pastel-blue-bg);
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-table);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .input-card label {
            font-size: 9px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-card input {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Google Sans', sans-serif;
            color: var(--text-main);
            outline: none;
            width: 100%;
        }

        .input-card input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .summary-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #f8fafc;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid var(--border-table);
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .summary-item.full {
            grid-column: span 2;
        }

        .summary-item span.label {
            font-size: 9px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .summary-item span.value {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
            font-size: 12px;
        }

        th, td {
            border-bottom: 1px solid var(--border-table);
            padding: 3px 4px;
            text-align: center;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-top: 1px solid var(--border-table);
        }

        th:first-child, td:first-child { text-align: left; padding-left: 4px; }
        th:last-child, td:last-child { text-align: right; padding-right: 4px; }

        td input {
            width: 48px;
            padding: 3px 2px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-family: 'Google Sans', sans-serif;
            font-size: 12px;
            outline: none;
            background: #fff;
        }

        td input::placeholder {
            color: #cbd5e1;
            opacity: 1;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { 
            -moz-appearance: textfield; 
        }

        td input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        button {
            font-family: 'Google Sans', sans-serif;
            border: none;
            padding: 7px 4px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .btn-clear { background-color: #fb923c; } 
        .btn-capture { background-color: #38bdf8; } 
        .btn-submit { background-color: #34d399; } 
    </style>
</head>
<body>
    <div class="container" id="captureArea">
        <h2>BẢNG KÊ TIỀN THỰC TẾ</h2>
        
        <div class="dashboard-inputs">
            <div class="input-card">
                <label for="employeeId">User Nhân viên</label>
                <input type="text" id="employeeId" placeholder="Nhập user...">
            </div>
            <div class="input-card">
                <label for="systemAmount">Tiền Hệ thống</label>
                <input type="text" id="systemAmount" placeholder="0" inputmode="numeric" oninput="formatCurrencyInput(this); calculateTotals();">
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-item">
                <span class="label">Ngày & Giờ</span>
                <span class="value" id="currentDateTime" style="font-size: 10px; font-weight: 500;">--/--/---- --:--:--</span>
            </div>
            <div class="summary-item">
                <span class="label">Thực tế</span>
                <span class="value" id="actualTotal">0 ₫</span>
            </div>
            <div class="summary-item full">
                <span class="label">Chênh lệch (Thực tế - Hệ thống)</span>
                <span class="value" id="discrepancy">0 ₫</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Mệnh giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody id="denominationTable"></tbody>
        </table>

        <div class="button-group">
            <button class="btn-clear" onclick="clearAll()">Xóa All</button>
            <button class="btn-capture" onclick="captureScreen()">Capture</button>
            <button class="btn-submit" onclick="submitData()">Xác Nhận</button>
        </div>
    </div>

    <script>
        const denominations = [500000, 200000, 100000, 50000, 20000, 10000, 5000, 2000, 1000];

        function initTable() {
            const tbody = document.getElementById('denominationTable');
            tbody.innerHTML = '';
            denominations.forEach(denom => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: 500;">${denom.toLocaleString('vi-VN')}</td>
                    <td><input type="number" inputmode="numeric" min="0" placeholder="0" data-denom="${denom}" oninput="calculateTotals()"></td>
                    <td class="text-right" id="subtotal-${denom}" style="font-variant-numeric: tabular-nums;">0</td>
                `;
                tbody.appendChild(row);
            });
            updateDateTime();
            setInterval(updateDateTime, 1000);
        }

        function captureScreen() {
            const element = document.getElementById('captureArea');
            html2canvas(element, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'bang_ke_tien_' + new Date().getTime() + '.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        function clearAll() {
            if(confirm("Bạn có chắc chắn muốn xóa hết dữ liệu đã nhập?")) {
                document.getElementById('employeeId').value = '';
                document.getElementById('systemAmount').value = '';
                document.querySelectorAll('#denominationTable input').forEach(input => input.value = '');
                calculateTotals();
            }
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentDateTime').innerText = now.toLocaleString('vi-VN');
        }

        function formatCurrencyInput(input) {
            let value = input.value.replace(/\D/g, '');
            input.value = value ? Number(value).toLocaleString('vi-VN') : '';
        }

        function calculateTotals() {
            let totalActual = 0;
            document.querySelectorAll('#denominationTable input').forEach(input => {
                const denom = Number(input.getAttribute('data-denom'));
                const qty = Number(input.value) || 0;
                const subtotal = denom * qty;
                totalActual += subtotal;
                document.getElementById(`subtotal-${denom}`).innerText = subtotal.toLocaleString('vi-VN');
            });
            document.getElementById('actualTotal').innerText = totalActual.toLocaleString('vi-VN') + ' ₫';
            
            const systemTotal = Number(document.getElementById('systemAmount').value.replace(/\./g, '')) || 0;
            const diff = totalActual - systemTotal;
            const diffEl = document.getElementById('discrepancy');
            
            diffEl.innerText = diff.toLocaleString('vi-VN') + ' ₫';
            if (diff > 0) {
                diffEl.style.color = '#059669'; 
            } else if (diff < 0) {
                diffEl.style.color = '#dc2626'; 
            } else {
                diffEl.style.color = '#1e293b'; 
            }
        }

        function submitData() {
            const empId = document.getElementById('employeeId').value.trim();
            if (!empId) {
                alert('Vui lòng nhập User nhân viên!');
                document.getElementById('employeeId').focus();
                return;
            }
            alert("Đã ghi nhận bảng kê của user: " + empId);
        }

        window.onload = initTable;
    </script>
</body>
</html>
